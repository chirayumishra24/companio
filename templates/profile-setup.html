<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Profile Setup - Companio</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .selected {
      background-color: #f472b6;
      color: white;
    }
  </style>
</head>
<body class="h-screen bg-cover bg-center bg-no-repeat relative" style="background-image: url('../static/images/travel-bg.jpg');">
  <div class="absolute inset-0 bg-black bg-opacity-60 z-0"></div>
  <div class="relative z-10 flex justify-center items-center h-full px-4">
    <div class="bg-white rounded-2xl shadow-lg p-8 w-full max-w-2xl overflow-y-auto max-h-[95vh]">
      <h1 class="text-2xl font-bold text-gray-800 mb-6 text-center">Create Your Travel Profile</h1>

      <form id="profile-form" class="space-y-4" enctype="multipart/form-data">
        <!-- Name -->
        <div>
          <label class="block mb-1 text-gray-700">First Name</label>
          <input type="text" name="firstName" required class="w-full px-4 py-2 border rounded-lg" />
        </div>

        <!-- Email -->
        <div>
          <label class="block mb-1 text-gray-700">Email</label>
          <input type="email" name="email" required readonly class="w-full px-4 py-2 border rounded-lg bg-gray-100" />
        </div>

        <!-- Birthday -->
        <div>
          <label class="block mb-1 text-gray-700">Birthday</label>
          <div class="flex space-x-2">
            <input type="number" name="dob_month" placeholder="MM" min="1" max="12" required class="w-1/3 px-3 py-2 border rounded-lg" />
            <input type="number" name="dob_day" placeholder="DD" min="1" max="31" required class="w-1/3 px-3 py-2 border rounded-lg" />
            <input type="number" name="dob_year" placeholder="YYYY" required class="w-1/3 px-3 py-2 border rounded-lg" />
          </div>
        </div>

        <!-- Gender -->
        <div>
          <label class="block mb-1 text-gray-700">Gender</label>
          <div class="flex space-x-2" id="gender-buttons">
            <button type="button" class="px-4 py-2 bg-gray-200 rounded hover:bg-gray-300" data-gender="man">Man</button>
            <button type="button" class="px-4 py-2 bg-gray-200 rounded hover:bg-gray-300" data-gender="woman">Woman</button>
            <button type="button" class="px-4 py-2 bg-gray-200 rounded hover:bg-gray-300" data-gender="other">Other</button>
          </div>
          <input type="hidden" name="gender" id="gender-input">
          <label class="mt-2 inline-flex items-center text-sm text-gray-600">
            <input type="checkbox" name="showGender" class="mr-2"> Show my gender on profile
          </label>
        </div>

        <!-- Photos Upload -->
        <div>
          <label class="block mb-1 text-gray-700">Upload Profile Photos (Max 6)</label>
          <template id="photo-template">
            <label class="photo-box w-full h-24 border border-dashed rounded flex items-center justify-center text-2xl text-gray-400 cursor-pointer relative overflow-hidden">
              <input type="file" name="photos[]" accept="image/*" class="absolute inset-0 opacity-0 cursor-pointer" />
              <span class="upload-text">+</span>
              <img class="absolute inset-0 w-full h-full object-cover hidden" />
            </label>
          </template>
          <div id="photo-grid" class="grid grid-cols-3 gap-2 mt-2"></div>
        </div>

        <div>
  <label class="block mb-1 text-gray-700">Bio</label>
  <textarea name="bio" rows="3" placeholder="Tell us about yourself..." class="w-full px-4 py-2 border rounded-lg"></textarea>
</div>

        <!-- Travel With Preference -->
        <div>
          <label class="block mb-1 text-gray-700">Interested in Travel With</label>
          <div class="flex space-x-2" id="interest-buttons">
            <button type="button" class="px-4 py-2 bg-gray-200 rounded hover:bg-gray-300" data-value="men">Men</button>
            <button type="button" class="px-4 py-2 bg-gray-200 rounded hover:bg-gray-300" data-value="women">Women</button>
            <button type="button" class="px-4 py-2 bg-gray-200 rounded hover:bg-gray-300" data-value="everyone">Everyone</button>
          </div>
          <input type="hidden" name="interestedIn" id="interest-input">
        </div>

        <!-- Interests -->
        <div>
          <label class="block mb-1 text-gray-700">Interests</label>
          <input type="text" name="interests" placeholder="e.g., Food, Music, Hiking" class="w-full px-4 py-2 border rounded-lg" />
        </div>

        <div>
  <label class="block mb-1 text-gray-700">Where Are You From?</label>
  <input type="text" name="location" placeholder="e.g., Udaipur, Rajasthan" class="w-full px-4 py-2 border rounded-lg" />
</div>

        <div>
  <label class="block mb-1 text-gray-700">Instagram Handle</label>
  <input type="text" name="socialLinks[instagram]" placeholder="@yourusername" class="w-full px-4 py-2 border rounded-lg" />
</div>
<div>
  <label class="block mb-1 text-gray-700">LinkedIn Handle</label>
  <input type="text" name="socialLinks[linkedin]" placeholder="https://linkedin.com/in/yourusername" class="w-full px-4 py-2 border rounded-lg" />
</div>

        <!-- Submit -->
        <div class="flex justify-between mt-6">
          <button type="button" onclick="window.location.href='/login'" class="text-gray-600 hover:text-gray-800">Back</button>
          <button type="submit" class="bg-pink-500 text-white py-2 px-6 rounded-lg hover:bg-pink-600">Continue</button>
          <button type="button" onclick="window.location.href='/matches'" class="text-gray-600 hover:text-gray-800">Skip</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    // Decode JWT
    function parseJWT(token) {
      try {
        return JSON.parse(atob(token.split('.')[1]));
      } catch {
        return null;
      }
    }

    document.addEventListener("DOMContentLoaded", () => {
      const params = new URLSearchParams(window.location.search);
      const tokenFromQuery = params.get("token");
      if (tokenFromQuery) {
        sessionStorage.setItem("token", tokenFromQuery);
        window.history.replaceState({}, "", "/profile-setup");
      }

      const token = sessionStorage.getItem('token');
      const emailInput = document.querySelector("input[name='email']");
      const form = document.getElementById('profile-form');

      if (!token || !emailInput) {
        alert("Unauthorized. Please log in first.");
        window.location.href = "/login";
        return;
      }

      const payload = parseJWT(token);
      if (payload?.email) {
        emailInput.value = payload.email;
      } else {
        alert("Invalid session.");
        window.location.href = "/login";
      }

      // Gender & Interest Selection
      document.querySelectorAll('#gender-buttons button').forEach(btn =>
        btn.addEventListener('click', () => {
          document.querySelectorAll('#gender-buttons button').forEach(b => b.classList.remove('selected'));
          btn.classList.add('selected');
          document.getElementById('gender-input').value = btn.dataset.gender;
        })
      );

      document.querySelectorAll('#interest-buttons button').forEach(btn =>
        btn.addEventListener('click', () => {
          document.querySelectorAll('#interest-buttons button').forEach(b => b.classList.remove('selected'));
          btn.classList.add('selected');
          document.getElementById('interest-input').value = btn.dataset.value;
        })
      );

      // Add photo upload boxes
      const grid = document.getElementById('photo-grid');
      const template = document.getElementById('photo-template').content;
      for (let i = 0; i < 6; i++) {
        const clone = template.cloneNode(true);
        const input = clone.querySelector('input');
        const img = clone.querySelector('img');
        const text = clone.querySelector('.upload-text');

        input.addEventListener('change', e => {
          const file = e.target.files[0];
          if (file) {
            const reader = new FileReader();
            reader.onload = () => {
              img.src = reader.result;
              img.classList.remove('hidden');
              text.classList.add('hidden');
            };
            reader.readAsDataURL(file);
          }
        });

        grid.appendChild(clone);
      }

      // Form submit
      form.addEventListener('submit', async (e) => {
        e.preventDefault();

        const gender = document.getElementById('gender-input').value;
        const interestedIn = document.getElementById('interest-input').value;

        if (!gender || !interestedIn) {
          alert("Please select gender and interest preferences.");
          return;
        }

        const formData = new FormData(form);

        try {
          const res = await fetch('/auth/profile-setup', {
            method: 'POST',
            headers: { Authorization: 'Bearer ' + token },
            body: formData
          });

          const result = await res.json();
          if (res.ok) {
            alert("✅ Profile saved!");
            window.location.href = '/matches';
          } else {
            alert(result.message || "❌ Failed to save profile.");
          }
        } catch (err) {
          console.error(err);
          alert("❌ Server error, please try again.");
        }
      });
    });
  </script>
</body>
</html>
