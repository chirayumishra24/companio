<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Set Password - Companio</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="h-screen bg-cover bg-center bg-no-repeat flex items-center justify-center relative" style="background-image: url('/static/images/travel-bg.jpg');">

  <div class="absolute inset-0 bg-black bg-opacity-60 z-0"></div>

  <div class="relative z-10 bg-white rounded-xl shadow-xl p-8 w-full max-w-md">
    <h2 class="text-2xl font-bold mb-2 text-center text-gray-800">Set Your Password</h2>
    <p class="text-center text-sm text-gray-600 mb-4">
      This will allow you to log in manually in the future.
    </p>

    <div class="text-center mb-4">
      <p class="text-sm font-medium text-gray-700">Email:</p>
      <p id="email-display" class="text-base font-semibold text-blue-600"></p>
    </div>

    <form id="setPasswordForm">
      <input type="password" name="password" id="password" placeholder="Enter new password" required class="w-full mb-4 px-4 py-2 border border-gray-300 rounded-md" />
      <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700">Set Password</button>
    </form>

    <p id="feedback" class="mt-4 text-center text-sm text-green-600 hidden">Password set successfully!</p>
  </div>

<script>
  document.addEventListener("DOMContentLoaded", () => {
    const form = document.getElementById("setPasswordForm");
    const passwordInput = document.getElementById("password");
    const emailDisplay = document.getElementById("email-display");

    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get("token");

    if (!token) {
      alert("Token missing");
      return;
    }

    // Decode JWT to show email
    try {
      const payload = JSON.parse(atob(token.split('.')[1]));
      emailDisplay.textContent = payload.email || "Email not found";
    } catch (err) {
      emailDisplay.textContent = "Invalid token";
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const password = passwordInput.value.trim();

      if (!password || password.length < 6) {
        alert("Password must be at least 6 characters long.");
        return;
      }

      try {
        const res = await fetch("/auth/set-password", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            Authorization: `Bearer ${token}`
          },
          body: JSON.stringify({ password })
        });

        const result = await res.json();

        if (res.ok) {
          localStorage.setItem("token", token); // Store the token for future use
          document.getElementById("feedback").classList.remove("hidden");

          // Check if profile exists → then redirect
          const checkRes = await fetch("/api/profile", {
            headers: {
              Authorization: `Bearer ${token}`
            }
          });

          if (checkRes.ok) {
            window.location.href = "/matches";
          } else {
            window.location.href = "/profile-setup";
          }
        } else {
          alert(result.message || "Failed to set password.");
        }
      } catch (err) {
        console.error("Set password error:", err);
        alert("Something went wrong. Please try again.");
      }
    });
  });
</script>

</body>
</html>
