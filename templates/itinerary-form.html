<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Create Itinerary - Companio</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="h-screen bg-cover bg-center bg-no-repeat relative" style="background-image: url('/static/images/travel-bg.jpg');">
  <!-- Overlay -->
  <div class="absolute inset-0 bg-black bg-opacity-60 z-0"></div>

  <!-- Form Container -->
  <div class="relative z-10 flex justify-center items-center h-full px-4">
    <div class="bg-white rounded-2xl shadow-xl p-8 w-full max-w-xl">
      <h1 class="text-2xl font-bold text-center text-gray-800 mb-4">Share Your Travel Itinerary</h1>
      <p class="text-center text-sm text-gray-600 mb-6">Let others know where you're heading and maybe find a companion!</p>

      <form id="travelForm" class="space-y-4">
        <div>
          <label class="block text-sm text-gray-700 mb-1">Destination</label>
          <input type="text" name="destination" placeholder="e.g., Manali" required class="w-full px-4 py-2 border border-gray-300 rounded-lg" />
        </div>

        <div class="flex space-x-2">
          <div class="w-1/2">
            <label class="block text-sm text-gray-700 mb-1">Start Date</label>
            <input type="date" name="startDate" required class="w-full px-3 py-2 border border-gray-300 rounded-lg" />
          </div>
          <div class="w-1/2">
            <label class="block text-sm text-gray-700 mb-1">End Date</label>
            <input type="date" name="endDate" required class="w-full px-3 py-2 border border-gray-300 rounded-lg" />
          </div>
        </div>

        <div>
          <label class="block text-sm text-gray-700 mb-1">Travel Type</label>
          <select name="travelType" class="w-full px-4 py-2 border border-gray-300 rounded-lg">
            <option value="">Select...</option>
            <option value="solo">Solo</option>
            <option value="couple">Couple</option>
            <option value="group">Group</option>
            <option value="family">Family</option>
          </select>
        </div>

        <div>
          <label class="block text-sm text-gray-700 mb-1">Budget (optional)</label>
          <input type="text" name="budget" placeholder="e.g., 5k - 10k INR" class="w-full px-4 py-2 border border-gray-300 rounded-lg" />
        </div>

        <div>
          <label class="block text-sm text-gray-700 mb-1">Interests</label>
          <input type="text" name="interests" placeholder="e.g., Trekking, Beaches, Culture" class="w-full px-4 py-2 border border-gray-300 rounded-lg" />
        </div>

        <div>
          <label class="block text-sm text-gray-700 mb-1">Trip Description</label>
          <textarea name="description" placeholder="Briefly describe your plan..." rows="4" class="w-full px-4 py-2 border border-gray-300 rounded-lg"></textarea>
        </div>

        <div class="flex justify-between mt-6">
          <button type="button" onclick="window.location.href='/matches'" class="text-gray-600 hover:text-gray-800">Cancel</button>
          <button type="submit" class="bg-blue-600 text-white py-2 px-6 rounded-lg hover:bg-blue-700">Submit</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    document.getElementById('travelForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const form = new FormData(e.target);
      const data = Object.fromEntries(form);
      const token = localStorage.getItem('token');

      if (!token) {
        alert("Please log in again.");
        window.location.href = '/login';
        return;
      }

      try {
        const res = await fetch('/api/itinerary', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            Authorization: `Bearer ${token}`
          },
          body: JSON.stringify(data)
        });

        const result = await res.json();

        if (res.ok) {
          alert("✅ Itinerary submitted!");
          window.location.href = '/matches';
        } else {
          alert(result.message || "❌ Failed to save itinerary.");
        }
      } catch (err) {
        console.error(err);
        alert("❌ Server error. Please try again.");
      }
    });
  </script>
</body>
</html>
