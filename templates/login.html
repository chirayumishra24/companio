<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login - Companio</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .close-btn {
      position: absolute;
      top: 1rem;
      right: 1rem;
      font-size: 1.5rem;
      font-weight: bold;
      color: #888;
      transition: color 0.3s ease;
      z-index: 50;
    }
    .close-btn:hover {
      color: #000;
    }
  </style>
</head>
<body class="h-screen bg-cover bg-center bg-no-repeat flex items-center justify-center relative" style="background-image: url('../static/images/travel-bg.jpg');">

  <div class="absolute inset-0 bg-black bg-opacity-60 z-0"></div>

  <div class="relative z-10 bg-white rounded-2xl shadow-xl p-8 w-full max-w-md">
    <button class="close-btn" onclick="closeLogin()">×</button>

    <h2 class="text-2xl font-bold mb-4 text-gray-800 text-center">Welcome back to Companio</h2>
    <p class="text-sm text-gray-600 mb-6 text-center">
      By tapping Log In or Continue, you agree to our
      <a href="#" class="text-blue-500 hover:underline">Terms</a>,
      <a href="#" class="text-blue-500 hover:underline">Privacy Policy</a> &
      <a href="#" class="text-blue-500 hover:underline">Cookie Policy</a>.
    </p>

    <div id="login-initial" class="text-center">
      <button id="google-login-btn" class="w-full bg-white border border-gray-300 text-gray-800 py-2 rounded-lg shadow-sm hover:bg-gray-100 mb-3">Continue with Google</button>
      <a href="#" class="text-sm text-blue-500 hover:underline" onclick="showMoreLoginOptions()">More Options</a>
    </div>

    <div id="login-more-options" class="mt-6 hidden">
      <form id="loginForm">
        <input type="email" name="email" placeholder="Email" required class="w-full mb-3 px-4 py-2 border border-gray-300 rounded-md" />
        <input type="password" name="password" placeholder="Password" required class="w-full mb-4 px-4 py-2 border border-gray-300 rounded-md" />
        <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700">Login</button>
      </form>
      <!-- <a href="#" class="text-sm text-blue-500 hover:underline mt-2 inline-block">Trouble Logging In?</a> -->
    </div>

    <p class="mt-6 text-center text-sm text-gray-600">
      Don’t have an account?
      <a href="/signup" class="text-blue-500 font-semibold hover:underline">Create one</a>
    </p>
  </div>

  <script>
    function showMoreLoginOptions() {
      document.getElementById('login-initial').classList.add('hidden');
      document.getElementById('login-more-options').classList.remove('hidden');
    }

    function closeLogin() {
      window.location.href = '/';
    }

    async function redirectAfterLogin(token) {
      try {
        sessionStorage.setItem('token', token);

        // Check if profile exists
        const res = await fetch('/api/profile', {
          headers: {
            'Authorization': `Bearer ${token}`
          }
        });

        if (res.ok) {
          window.location.href = '/matches';
        } else {
          window.location.href = '/profile-setup';
        }
      } catch (err) {
        console.error("Redirection error:", err);
        window.location.href = '/profile-setup'; // fallback
      }
    }

    document.addEventListener("DOMContentLoaded", () => {
      const form = document.getElementById('loginForm');
      if (form) {
        form.addEventListener('submit', async (e) => {
          e.preventDefault();
          const formData = new FormData(form);
          const data = Object.fromEntries(formData);

          try {
            const res = await fetch('/auth/login', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(data)
            });

            const result = await res.json();

            if (res.ok) {
  const { token, profileSetupComplete } = result;
  sessionStorage.setItem("token", token);
  window.location.href = profileSetupComplete ? "/matches" : "/profile-setup";

            } else {
              alert(result.message || "Login failed.");
            }
          } catch (err) {
            alert("Something went wrong. Please try again.");
          }
        });
      }

      document.getElementById("google-login-btn")?.addEventListener("click", () => {
        window.location.href = "/auth/google";
      });

      const urlParams = new URLSearchParams(window.location.search);
      const googleToken = urlParams.get('token');
      if (googleToken) {
        redirectAfterLogin(googleToken);
      }

      const token = sessionStorage.getItem("token");
      if (token) {
        try {
          const payload = JSON.parse(atob(token.split('.')[1]));
          const exp = payload.exp * 1000;
          if (Date.now() < exp) {
            window.location.href = "/matches";
          }
        } catch (err) {
          console.warn("Invalid token");
        }
      }
    });
  </script>
</body>
</html>
