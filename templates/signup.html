<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Signup - Companio</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .close-btn {
      position: absolute;
      top: 1rem;
      right: 1rem;
      font-size: 1.5rem;
      font-weight: bold;
      color: #888;
      transition: color 0.3s ease;
      z-index: 50;
    }
    .close-btn:hover {
      color: #000;
    }
  </style>
</head>
<body class="h-screen bg-cover bg-center bg-no-repeat flex items-center justify-center relative" style="background-image: url('../static/images/travel-bg.jpg');">

  <div class="absolute inset-0 bg-black bg-opacity-60 z-0"></div>

  <div class="relative z-10 bg-white rounded-2xl shadow-xl p-8 w-full max-w-md">
    <button class="close-btn" onclick="closeSignup()">×</button>

    <h2 class="text-2xl font-bold mb-4 text-gray-800 text-center">Create account</h2>
    <p class="text-sm text-gray-600 mb-6 text-center">
      By tapping Log In or Continue, you agree to our
      <a href="#" class="text-blue-500 hover:underline">Terms</a>. Learn how we process your data in our
      <a href="#" class="text-blue-500 hover:underline">Privacy Policy</a> and 
      <a href="#" class="text-blue-500 hover:underline">Cookie Policy</a>.
    </p>

    <div id="signup-initial" class="text-center">
      <button id="google-signup-btn" class="w-full bg-white border border-gray-300 text-gray-800 py-2 rounded-lg shadow-sm hover:bg-gray-100 mb-3">Continue with Google</button>
      <a href="#" class="text-sm text-blue-500 hover:underline" onclick="showMoreSignupOptions()">More Options</a>
    </div>

    <div id="signup-more-options" class="mt-6 hidden">
      <form id="signupForm">
        <input type="email" name="email" placeholder="Email" required class="w-full mb-3 px-4 py-2 border border-gray-300 rounded-md" />
        <input type="password" name="password" placeholder="Password" required class="w-full mb-4 px-4 py-2 border border-gray-300 rounded-md" />
        <button type="submit" class="w-full bg-pink-500 text-white py-2 rounded-lg hover:bg-pink-600">Continue</button>
      </form>
      <a href="#" class="text-sm text-blue-500 hover:underline mt-2 inline-block">Trouble Logging In?</a>
    </div>

    <p class="mt-6 text-center text-sm text-gray-600">
      Already have an account?
      <a href="/login" class="text-blue-500 font-semibold hover:underline">Log in</a>
    </p>
  </div>

  <script>
    function showMoreSignupOptions() {
      document.getElementById('signup-initial').classList.add('hidden');
      document.getElementById('signup-more-options').classList.remove('hidden');
    }

    function closeSignup() {
      window.location.href = '/';
    }

    async function redirectAfterLogin(token) {
      try {
        sessionStorage.setItem('token', token);
        const res = await fetch('/api/profile', {
          headers: {
            'Authorization': `Bearer ${token}`
          }
        });
        if (res.ok) {
          window.location.href = '/matches';
        } else {
          window.location.href = '/profile-setup';
        }
      } catch (err) {
        console.error("Redirection error:", err);
        window.location.href = '/profile-setup';
      }
    }

    document.addEventListener("DOMContentLoaded", () => {
      const form = document.getElementById('signupForm');
      if (form) {
        form.addEventListener('submit', async (e) => {
          e.preventDefault();
          const formData = new FormData(form);
          const data = Object.fromEntries(formData);

          try {
            const res = await fetch('/auth/signup', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(data)
            });

            const result = await res.json();

            if (res.ok) {
              // Login after signup
              const loginRes = await fetch('/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: data.email, password: data.password })
              });

              const loginData = await loginRes.json();
              if (loginRes.ok) {
                await redirectAfterLogin(loginData.token);
              } else {
                alert("Login failed after signup");
              }
            } else {
              alert(result.message || "Signup failed.");
            }
          } catch (err) {
            alert("Something went wrong. Please try again.");
          }
        });
      }

      document.getElementById("google-signup-btn")?.addEventListener("click", () => {
        window.location.href = "/auth/google";
      });

      const urlParams = new URLSearchParams(window.location.search);
      const googleToken = urlParams.get('token');
      if (googleToken) {
        redirectAfterLogin(googleToken);
      }

      const token = sessionStorage.getItem("token");
      const isLoginPage = window.location.pathname.includes("login");
      const isSignupPage = window.location.pathname.includes("signup");

      if (token && !isLoginPage && !isSignupPage) {
        try {
          const payload = JSON.parse(atob(token.split('.')[1]));
          const exp = payload.exp * 1000;
          if (Date.now() < exp) {
            window.location.href = "/matches";
          }
        } catch (err) {
          console.warn("Invalid token");
        }
      }
    });
  </script>

</body>
</html>
