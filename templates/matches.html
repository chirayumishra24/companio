<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Companio – Find a Match</title>
  <link rel="stylesheet" href="../css/styles.css" />
</head>
<body class="bg-gray-100 p-4">
  <!-- Toolbar -->
  <div class="flex justify-between items-center mb-4">
    <a href="./index.html" class="text-blue-600 underline">← Back to Home</a>
    <select id="destinationFilter" class="border px-2 py-1 rounded">
      <option value="">All Destinations</option>
      <option value="Goa">Goa</option>
      <option value="Ladakh">Ladakh</option>
      <option value="Manali">Manali</option>
    </select>
  </div>

  <!-- Profile Card -->
  <div id="profileCard" class="bg-white rounded-xl shadow-md p-4 transition-opacity duration-300">
    <img id="profilePhoto" src="../static/images/dummy-user.png" alt="User Photo" class="rounded-full w-32 h-32 mx-auto">
    <h2 id="profileName" class="text-xl text-center font-semibold mt-2"></h2>
    <p id="profileInfo" class="text-center text-gray-600 mb-2"></p>
    <p id="compatibilityScore" class="text-center text-blue-500 font-semibold mb-2"></p>
    <p id="swipeCounter" class="text-center text-sm text-gray-400"></p>

    <div class="flex justify-center gap-6 mt-4">
      <button id="dislikeBtn" class="bg-red-500 text-white px-4 py-2 rounded-full">❌</button>
      <button id="likeBtn" class="bg-green-500 text-white px-4 py-2 rounded-full">✅</button>
    </div>
  </div>

  <script src="../static/js/match.js"></script>
  <div id="chat-box"></div>
  <script src="../static/js/chat.js"></script>
</body>
</html>
